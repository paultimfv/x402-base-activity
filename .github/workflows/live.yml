name: hourly live
on:
  schedule:
    - cron: "5 * * * *"     # hourly, :05 past
  workflow_dispatch:
concurrency: live
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install web3 pandas pyarrow requests python-dotenv
      - name: live x402 (last hour of Base, free public RPC)
        env:
          LIVE_BUDGET_MIN: "40"
        run: python -u pipeline/live.py
      # the site reads web/public/data/x402_live.json straight from this repo (re-checked every 5 min): no redeploy
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/live web/public/data/x402_live.json
          git diff --cached --quiet || git commit -m "live: $(date -u +%FT%H:%MZ)"
          git push
